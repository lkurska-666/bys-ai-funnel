<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>BYS Funnel — desktop</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
/* ==========================================================================
   Tokens — mirrored 1:1 from the Figma file (BYS-Chat-funnel)
   Primitives → Semantic, same names as the variable collections.
   ========================================================================== */
:root{
  /* primitives — neutral ramp from the reference palette */
  --gray-50:#F9FAFB;  --gray-100:#F3F4F6; --gray-200:#E5E7EB; --gray-300:#D1D5DB;
  --gray-400:#9CA3AF; --gray-500:#6B7280; --gray-600:#4B5563; --gray-700:#374151;
  --gray-800:#1F2937; --gray-900:#111827;
  --white:#FFFFFF;
  --pink-800:#D80052; --pink-900:#FE0161; --pink-950:#AD0042;
  --teal-300:#009A7B; --teal-400:#007B60; --teal-600:#006950; --teal-1000:#041B20;
  --green-600:#16A34A; --green-900:#14532D; --green-50:#F0FDF4;
  --sky-50:#F0F9FF; --sky-600:#0284C7; --sky-900:#0C4A6E;
  --amber-50:#FFFBEB; --amber-600:#D97706; --amber-900:#5E4200;
  --red-600:#DC2626;  --red-700:#B91C1C;  --red-50:#FEF2F2;
  --accent-turquoise:#4BD8E2; --accent-lime:#15FA11; --accent-lemon:#E8FA11;

  /* alpha ramps — foreground / primary with baked alpha */
  --fg-alpha-4:rgba(17,24,39,.04);
  --fg-alpha-8:rgba(17,24,39,.08);
  --fg-alpha-48:rgba(17,24,39,.48);
  --primary-alpha-8:rgba(254,1,97,.08);
  --primary-alpha-48:rgba(254,1,97,.48);
  --primary-alpha-80:rgba(254,1,97,.8);

  /* semantic */
  --background:var(--white);
  --foreground:var(--gray-900);
  --card:var(--white);
  --card-foreground:var(--gray-900);
  --primary:var(--pink-900);
  --primary-hover:var(--pink-800);
  --primary-active:var(--pink-950);
  --primary-foreground:var(--white);
  --secondary:var(--gray-900);
  --secondary-hover:var(--gray-800);
  --secondary-foreground:var(--white);
  --muted:var(--gray-100);
  --muted-foreground:var(--gray-500);
  --accent:var(--gray-100);
  --accent-hover:var(--gray-200);
  --accent-foreground:var(--gray-900);
  --destructive:var(--red-600);
  --destructive-muted:var(--red-50);
  --card-muted:var(--gray-50);
  --border:var(--gray-200);
  --border-strong:var(--gray-300);
  --ring:var(--pink-900);
  --success:var(--green-600);
  --info:var(--sky-600); --info-muted:var(--sky-50); --info-foreground:var(--sky-900);
  --warning:var(--amber-600); --warning-muted:var(--amber-50); --warning-foreground:var(--amber-900);
  --success-muted:var(--green-50);
  --brand:var(--teal-300);
  --brand-hover:var(--teal-400);
  --brand-foreground:var(--white);

  /* spacing / radius */
  --space-xs:4px; --space-sm:8px; --space-md:12px; --space-lg:16px;
  --space-xl:24px; --space-2xl:32px; --space-3xl:48px; --space-4xl:64px;
  --radius-sm:4px; --radius-md:8px; --radius-lg:12px; --radius-xl:16px; --radius-full:9999px;

  /* effect styles */
  --shadow-small:0 1px 4px var(--fg-alpha-4);
  --shadow-medium:0 4px 16px var(--fg-alpha-8);
  --focus-ring:0 0 0 4px var(--primary-alpha-8);
}

*{box-sizing:border-box;}
html,body{height:100%;}
[hidden]{display:none !important;}
body{
  margin:0; background:var(--background); color:var(--foreground);
  font-family:'Poppins',system-ui,sans-serif; overflow:hidden;
}
button{font-family:inherit;}
:focus-visible{outline:none; box-shadow:var(--focus-ring);}

/* ---------- text styles (the 7 local styles from Figma) ---------- */
.t-body-default     {font-size:16px; font-weight:400; line-height:24px;}
.t-body-default-emph{font-size:16px; font-weight:500; line-height:24px;}
.t-body-small        {font-size:14px; font-weight:400; line-height:20px;}
.t-label-assistant   {font-size:14px; font-weight:600; line-height:20px; letter-spacing:1px; text-transform:uppercase;}
.t-label-section     {font-size:12px; font-weight:600; line-height:18px; letter-spacing:1px; text-transform:uppercase;}
.t-caption           {font-size:12px; font-weight:400; line-height:18px;}
.t-caption-emph      {font-size:12px; font-weight:600; line-height:18px;}
/* Body/Link — underlined text that acts as a button: the skips, "I want another name".
   Same 16/24 as Body/Default on purpose, so a link never reads as a smaller class of
   thing than the sentence above it. */
.t-body-link         {font-size:16px; font-weight:400; line-height:24px;
  text-decoration:underline; text-underline-offset:3px;}

/* ---------- background wash (Background/Glow) ---------- */
.blobs{position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0;}
.blob{position:absolute; border-radius:50%;}
.blob--turquoise{width:536px; height:536px; right:-276px; top:-44px; background:var(--accent-turquoise); filter:blur(250px);}
.blob--lime{width:346px; height:346px; left:190px; top:-174px; background:var(--accent-lime); filter:blur(200px);}
.blob--lemon{width:288px; height:288px; left:-68px; top:524px; background:var(--accent-lemon); filter:blur(200px);}

/* ---------- shell ---------- */
.app{position:relative; z-index:1; height:100vh; display:flex; flex-direction:column;}
.nav{height:64px; flex-shrink:0; display:flex; align-items:center; gap:var(--space-lg); padding:0 var(--space-2xl);}
.nav-logo svg{height:24px; width:auto; display:block;}
.nav-spacer{flex:1;}
.account{display:flex; align-items:center; gap:var(--space-sm);}
.account-avatar{width:32px; height:32px; border-radius:var(--radius-full); background:var(--brand); color:var(--brand-foreground); display:flex; align-items:center; justify-content:center;}
.account-avatar svg{width:18px; height:18px;}
.account-name{color:var(--foreground);}
.account-chevron{width:12px; height:12px; color:var(--foreground);}
.ghost-btn{height:32px; padding:0 12px; border-radius:var(--radius-md); border:1px solid transparent; background:transparent; color:var(--muted-foreground); font-size:12.5px; font-weight:500; cursor:pointer;}
.ghost-btn:hover{color:var(--foreground); border-color:var(--border);}
.ghost-btn.on{color:var(--primary); border-color:var(--primary-alpha-48);}

.stage{flex:1; min-height:0; overflow-y:auto; padding:24px 32px 64px;}
.chat{width:100%; max-width:882px; margin:0 auto;}

/* ---------- section divider (Label/Section) ---------- */
.divider{display:flex; align-items:center; gap:14px; margin:32px 0 20px;}
.divider:first-child{margin-top:0;}
.divider span{color:var(--muted-foreground); white-space:nowrap;}
.divider i{flex:1; height:1px; background:var(--border);}

/* ---------- assistant row ---------- */
/* A turn guarantees its own air above it. Adjacent margins collapse in the chat column,
   so this reads as a minimum, not an addition: after a normal 20px block it stays 20,
   and after a block with its own tight bottom edge — the spent CTA row at 8px, the domain
   list at 0 — it still gets 20 instead of sticking to it. */
.ai-row{display:flex; gap:var(--space-sm); align-items:flex-start; margin:20px 0;}
.ai-avatar{width:32px; height:32px; border-radius:var(--radius-full); background:var(--card); box-shadow:var(--shadow-small);
  display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.ai-avatar svg{width:18px; height:18px;}
.ai-body{min-width:0;}
.ai-label{color:var(--muted-foreground); margin-bottom:4px;}
.ai-bubble{background:var(--card); border:1px solid var(--border); border-radius:14px;
  padding:12px 16px; max-width:556px; box-shadow:var(--shadow-small); color:var(--card-foreground);}

/* assistant status: Typing / Thinking / Slow */
.status{display:flex; flex-direction:column; gap:var(--space-xs); padding:6px 0;}
.status-row{display:flex; align-items:center; gap:var(--space-sm);}
.status-row svg{width:20px; height:20px; color:var(--muted-foreground);}
.status-label{color:var(--muted-foreground);}
.status-note{color:var(--muted-foreground);}
.dots{display:flex; gap:5px; padding:7px 0;}
.dots i{width:6px; height:6px; border-radius:50%; background:var(--muted-foreground); animation:blink 1.2s infinite ease-in-out;}
.dots i:nth-child(2){animation-delay:.2s;}
.dots i:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,80%,100%{opacity:.25;} 40%{opacity:1;}}
.shimmer-text{animation:pulse 1.6s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;} 50%{opacity:.55;}}

/* ---------- user reply ---------- */
.user-row{display:flex; justify-content:flex-end; margin-bottom:20px;}
.user-bubble{background:var(--secondary); color:var(--secondary-foreground); border-radius:14px; padding:10px 16px; max-width:70%;}

/* ---------- answer pills ---------- */
.pill-rows{display:flex; flex-wrap:wrap; gap:var(--space-sm); margin:0 0 20px 40px;}
.pill{display:inline-flex; align-items:center; gap:var(--space-sm); height:44px; padding:0 18px;
  border:1px solid var(--border-strong); border-radius:var(--radius-full); background:var(--background);
  color:var(--foreground); cursor:pointer; box-shadow:var(--shadow-small);
  font-size:16px; font-weight:500; line-height:24px; transition:border-color 150ms, color 150ms, background 150ms;}
.pill svg{width:17px; height:17px; flex-shrink:0;}
.pill img{width:20px; height:20px; display:block; flex-shrink:0;}
.pill:hover{border-color:var(--gray-400);}
.pill.selected{border:2px solid var(--primary); color:var(--primary); padding:0 17px;}
.pill:disabled{cursor:default;}
.pill:disabled:not(.selected){opacity:.45;}

/* ---------- design cards ---------- */
.indent{margin-left:40px;}
.choose-row{display:flex; align-items:baseline; justify-content:space-between; width:844px; max-width:100%; margin:0 0 8px 40px;}
.choose-row .hint{color:var(--muted-foreground);}
.counter{color:var(--muted-foreground);}
.counter.full{color:var(--primary);}
.card-grid{display:grid; grid-template-columns:repeat(3, 276px); gap:var(--space-sm); margin:0 0 20px 40px; width:844px; max-width:100%;}
.design-card{position:relative; width:276px; height:130px; padding:0; border:1px solid var(--border-strong);
  border-radius:var(--radius-md); overflow:hidden; cursor:pointer; background:var(--card) center/cover no-repeat;
  box-shadow:var(--shadow-small); transition:border-color 150ms;}
.design-card:hover{border-color:var(--gray-400);}
.design-card.selected{border:2px solid var(--primary);}
.design-card .badge{position:absolute; top:8px; right:8px; width:20px; height:20px; border-radius:50%;
  background:var(--card); border:1px solid var(--border-strong); color:transparent;
  display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; line-height:18px;}
.design-card.selected .badge{background:var(--primary); border-color:var(--primary); color:var(--primary-foreground);}
.design-card:disabled{cursor:default;}
.design-card:disabled:not(.selected){opacity:.5;}

/* ---------- button (Figma component: 44px, radius/full) ---------- */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:var(--space-sm);
  height:44px; padding:0 var(--space-xl); border:none; border-radius:var(--radius-full);
  background:var(--primary); color:var(--primary-foreground); cursor:pointer;
  font-size:16px; font-weight:500; line-height:24px; transition:background 150ms;}
.btn svg{width:20px; height:20px;}
.btn:hover{background:var(--primary-hover);}
.btn:active{background:var(--primary-active);}
.btn:disabled{background:var(--primary-alpha-48); cursor:not-allowed;}
.btn-row{display:flex; gap:var(--space-md); margin:0 0 20px 40px;}

/* ---------- preview skeleton ---------- */
.skeleton{background:var(--card); border:1px solid var(--border);
  border-radius:var(--radius-lg); box-shadow:var(--shadow-small); overflow:hidden; margin:0 0 20px 40px;}
.sk-chrome{display:flex; align-items:center; gap:var(--space-xs); padding:12px 16px; background:var(--background);}
.sk-chrome .sk-dot{width:8px; height:8px; border-radius:50%; background:var(--muted);}
.sk-nav{display:flex; align-items:center; justify-content:space-between; padding:16px 20px;}
.sk-links{display:flex; gap:var(--space-md);}
.sk-hero{padding:24px 20px; display:flex; flex-direction:column; gap:var(--space-sm);}
.sk-products{display:grid; grid-template-columns:repeat(3,1fr); gap:var(--space-md); padding:0 20px 24px;}
.sk-cell{display:flex; flex-direction:column; gap:var(--space-xs);}
.sk{position:relative; overflow:hidden; background:var(--muted); border-radius:var(--radius-sm);}
.sk::after{content:''; position:absolute; inset:0; transform:translateX(-100%);
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.7), transparent);
  animation:shimmer 1.4s infinite;}
@keyframes shimmer{100%{transform:translateX(100%);}}
.sk--url{width:180px; height:10px; border-radius:var(--radius-full); margin-left:6px;}
.sk--logo{width:96px; height:12px;}
.sk--link{width:40px; height:8px;}
.sk--link.wide{width:48px;}
.sk--hero{height:190px; border-radius:var(--radius-md);}
.sk--line-lg{width:280px; height:14px;}
.sk--line-sm{width:180px; height:10px;}
.sk--img{height:90px; border-radius:var(--radius-md);}
.sk--cap{width:90px; height:8px;}
.sk--cap.short{width:56px;}

/* ---------- states reference (prototype affordance) ---------- */
.states-ref{margin:0 0 20px 40px; display:flex; flex-direction:column; gap:var(--space-lg);}
.state-item{display:flex; align-items:flex-start; gap:var(--space-xl);}
.state-item .demo{min-width:280px;}
.state-item .meta{color:var(--muted-foreground); padding-top:4px;}

/* ---------- handoff sheet ---------- */
.handoff{position:fixed; inset:0; background:rgba(17,24,39,.45); display:flex; align-items:center; justify-content:center; z-index:60;}
.sheet{width:320px; background:var(--card); border:1px solid var(--border); border-radius:var(--radius-lg);
  overflow:hidden; box-shadow:var(--shadow-medium);}
.sheet-bar{display:flex; align-items:center; gap:5px; padding:10px 12px; background:var(--card-muted); border-bottom:1px solid var(--border);}
.sheet-bar i{width:7px; height:7px; border-radius:50%; background:var(--border-strong);}
.sheet-url{margin-left:8px; color:var(--muted-foreground); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.sheet-body{padding:28px 20px; display:flex; flex-direction:column; align-items:center; gap:var(--space-md); text-align:center;}
.sheet-spin{width:22px; height:22px; border-radius:50%; border:2.5px solid var(--border); border-top-color:var(--primary); animation:spin .8s linear infinite;}

/* ---------- Shopify plan step ---------- */
.offer{margin:0 0 12px 40px; max-width:480px; background:var(--card); border:1px solid var(--border);
  border-radius:var(--radius-xl); box-shadow:var(--shadow-medium); overflow:hidden;}
.offer-top{padding:var(--space-xl); display:flex; flex-direction:column; gap:var(--space-md);}
.offer-pitch{min-width:0; display:flex; flex-direction:column; gap:var(--space-md);}
.offer-sub{color:var(--muted-foreground); margin:0;}
.cta-row{display:flex; align-items:center; gap:var(--space-lg); margin:24px 0 8px 40px; flex-wrap:wrap;}
.cta-reassure{display:inline-flex; align-items:center; gap:var(--space-sm); color:var(--foreground);}
.cta-reassure svg{width:16px; height:16px; flex-shrink:0; stroke:var(--success); stroke-width:2.5;}
/* Title/Default — the one size above Body, shared by a sheet title and an offer headline.
   Her call: 24/32, the same as the modal title, so the two stop being separate sizes. */
.offer-title{font-size:24px; font-weight:600; line-height:32px; letter-spacing:-.02em;}
.offer-ladder{color:var(--muted-foreground); margin-top:2px;}
.price{display:flex; align-items:baseline; gap:var(--space-sm); flex-wrap:wrap;}
.price-now{font-size:32px; font-weight:700; line-height:40px; letter-spacing:-.02em;}
.price-unit{color:var(--muted-foreground);}
.price-then{color:var(--muted-foreground);}
.save-chip{display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:var(--radius-full);
  background:var(--success-muted); color:var(--green-900); border:1px solid rgba(22,163,74,.25);}
.save-chip svg{width:13px; height:13px; stroke:var(--success); stroke-width:3;}
.benefits{display:flex; flex-direction:column; gap:var(--space-sm); margin:0; padding:0; list-style:none;}
.benefits li{display:flex; gap:var(--space-sm); align-items:flex-start; color:var(--foreground);}
.benefits svg{width:16px; height:16px; flex-shrink:0; margin-top:2px; stroke:var(--success); stroke-width:2.5;}

/* 3-node path */
.path{display:flex; align-items:flex-start; padding:var(--space-lg) var(--space-xl) 0; background:var(--card-muted);}
.path-node{flex:1; position:relative; display:flex; flex-direction:column; align-items:flex-start; text-align:left; gap:10px;}
/* the connector runs from one circle to the next, not as a stub in the flow between two
   nodes — a node is 1/3 of the row but its circle is only 40px, so a stub in the gap sits
   nowhere near the circle it leaves. 4px of overlap at each end, and the circles paint on
   top of it, so the join is seamless whatever the row width. */
.path-node + .path-node::before{content:''; position:absolute; top:20px; left:calc(-100% + 36px);
  width:calc(100% - 32px); height:1px; background:var(--border);}
.path-circle{position:relative; z-index:1;
  width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  transition:background-color 320ms ease;}
.path-circle svg{width:18px; height:18px; stroke-width:2;}
.path-node.done .path-circle{background:var(--success); color:var(--white);}
.path-node.active .path-circle{background:var(--teal-1000); color:var(--white);}
.path-node.next .path-circle{background:var(--card); border:1px solid var(--border-strong); color:var(--muted-foreground);}
.path-circle--mark svg{width:17px; height:17px;}
.path-label{font-size:14px; font-weight:600; line-height:20px;}
.path-label span{display:block; font-weight:400; color:var(--muted-foreground);}
.path-foot{padding:var(--space-lg) var(--space-xl) var(--space-xl); background:var(--card-muted); color:var(--muted-foreground);}

/* trust row + disclosure */
.trust{display:flex; flex-wrap:wrap; gap:var(--space-lg); margin:0 0 8px 40px; color:var(--muted-foreground);}
.trust span{display:inline-flex; align-items:center; gap:6px;}
.trust svg{width:14px; height:14px;}
.asks{display:flex; flex-direction:column; gap:var(--space-sm); margin:0 0 20px 40px; max-width:600px;}
.disclosure{max-width:600px;}
.disclosure summary{cursor:pointer; color:var(--muted-foreground); display:inline-flex; align-items:center; gap:6px; list-style:none;}
.disclosure summary::-webkit-details-marker{display:none;}
.disclosure summary svg{width:14px; height:14px; transition:transform 150ms;}
.disclosure[open] summary svg{transform:rotate(180deg);}
.disclosure p{margin:8px 0 0; color:var(--muted-foreground);}

/* waiting for the return leg */
.btn-link{background:none; border:none; padding:0; color:var(--muted-foreground); cursor:pointer; text-decoration:underline; text-underline-offset:3px;}
.btn-link:hover{color:var(--foreground);}
.waiting{margin:0 0 20px 40px; display:flex; flex-direction:column; gap:var(--space-md);}
.waiting-row{display:flex; align-items:center; gap:var(--space-sm); color:var(--muted-foreground);}
.waiting-row.done{color:var(--foreground); font-weight:500;}
.waiting-row.done svg{width:16px; height:16px; stroke:var(--success); stroke-width:2.5; flex-shrink:0;}
.waiting-row .spin{width:14px; height:14px; border-radius:50%; border:2px solid var(--border);
  border-top-color:var(--primary); animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.banner{display:flex; align-items:center; gap:var(--space-sm); margin:0 0 20px 40px; padding:12px 16px;
  border-radius:var(--radius-lg); background:var(--success-muted); border:1px solid rgba(22,163,74,.35); color:var(--green-900);}
.banner svg{width:16px; height:16px; stroke:var(--success); stroke-width:2.5; flex-shrink:0;}
.btn-ghost{background:transparent; color:var(--muted-foreground); border:1px solid var(--border-strong);}
.btn-ghost:hover{background:var(--card); color:var(--foreground);}

/* ---------- payment modal ----------
   The only place in the funnel where the user types. That is not a break with the
   no-typing rule but the exception the rule already allows: a card number is
   inherently a typed value, the same reason the domain step gets a real field. */
.modal-back{position:fixed; inset:0; z-index:30; background:var(--fg-alpha-48);
  display:flex; align-items:center; justify-content:center; padding:var(--space-2xl);}
.modal{width:632px; max-width:100%; max-height:100%; overflow-y:auto;
  background:var(--card); border-radius:var(--radius-xl); box-shadow:var(--shadow-medium);
  padding:var(--space-2xl);}
.modal-head{display:flex; align-items:center; gap:var(--space-lg); margin-bottom:var(--space-xl);}
.modal-title{flex:1; text-align:left; font-size:24px; font-weight:600; line-height:32px;}
.modal-close{width:32px; height:32px; border:none; background:none; border-radius:var(--radius-md);
  color:var(--muted-foreground); cursor:pointer; display:flex; align-items:center; justify-content:center;}
.modal-close:hover{background:var(--accent); color:var(--foreground);}
.modal-close svg{width:18px; height:18px;}
.modal-item{display:flex; align-items:center; gap:var(--space-lg); padding:var(--space-lg);
  background:var(--card-muted); border-radius:var(--radius-lg); margin-bottom:var(--space-xl);}
.modal-item img{width:120px; border-radius:var(--radius-sm); display:block;}
.modal-item-body{flex:1; min-width:0;}
.modal-item-name{margin-bottom:var(--space-xs);}
.modal-price{text-align:right; flex-shrink:0;}
.modal-price b{display:block;}
.modal-foot{display:flex; align-items:center; justify-content:center; gap:6px;
  margin-top:var(--space-md); color:var(--muted-foreground);}
.modal-foot svg{width:14px; height:14px;}

/* form control — mirrors the Input / Dropdown components in Figma */
.field{display:flex; flex-direction:column; gap:var(--space-sm); margin-bottom:var(--space-lg);}
.field-row{display:flex; gap:var(--space-lg);}
.field-row .field{flex:1; min-width:0;}
.field-label{font-size:14px; font-weight:500; line-height:20px;}
.control{height:44px; display:flex; align-items:center; gap:10px; padding:0 var(--space-md);
  background:var(--card); border:1px solid var(--border-strong); border-radius:var(--radius-md);}
.control:focus-within{border-color:var(--ring); box-shadow:var(--focus-ring);}
.control svg{width:20px; height:20px; stroke:var(--muted-foreground); flex-shrink:0;}
/* the wrapper carries the focus ring, so the field inside must not draw its own: the
   universal :focus-visible rule was giving it a second one, invisible while the two
   agreed and plainly visible in the error state, where .control suppresses its own and
   the inner ring was left glowing inside the red border. */
.control input, .control select{flex:1; min-width:0; border:none; outline:none; background:none;
  box-shadow:none; font-family:inherit; font-size:16px; line-height:24px; color:var(--foreground);}
.control input::placeholder{color:var(--muted-foreground);}
.control input[readonly]{cursor:default;}
.control select{color:var(--muted-foreground); appearance:none; cursor:pointer;}

/* ---------- 06 · store type: production's two-card comparison, in the column ---------- */
.types{display:flex; flex-direction:column; gap:var(--space-sm); margin:0 0 20px 40px;}
.type{display:flex; flex-direction:column; gap:var(--space-xl);
  padding:var(--space-xl); border-radius:var(--radius-lg);
  background:var(--card-muted); border:1px solid var(--border);}
.type--pro{position:relative; overflow:hidden; background:var(--background);
  border-color:var(--ring); box-shadow:var(--shadow-medium);}
.type-body{display:flex; align-items:flex-start; gap:var(--space-xl);}
.type-col{flex:1; min-width:0; display:flex; flex-direction:column; gap:var(--space-lg);}
.type-shot{flex:0 0 364px;}
.type-shot img{display:block; width:100%; height:auto; border-radius:var(--radius-md);}
/* corner ribbon: measured, not guessed — below this the band's visible chord is
   shorter than the label and clips it */
.ribbon{position:absolute; top:30px; right:-46px; width:180px; text-align:center; padding:4px 0;
  transform:rotate(45deg); background:var(--primary); color:var(--primary-foreground);
  letter-spacing:.2px;}
.type-name{padding-right:var(--space-2xl);}
.type-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:12px;}
.type-list li{display:flex; align-items:flex-start; gap:var(--space-sm);}
.type-list svg{width:16px; height:16px; flex-shrink:0; margin-top:2px; stroke-width:2;}
.type-list li.yes svg{stroke:var(--success);}
.type-list li.no{color:var(--muted-foreground);}
.type-list li.no svg{stroke:var(--destructive);}
/* no storefront picture exists for either type, so each card is identified by one
   icon instead: an even grid of products, against one large panel with small ones
   under it. Shape only — no text, no brand colour. */
.type-head{display:flex; align-items:center; gap:var(--space-md);}
.type-icon{width:40px; height:40px; border-radius:var(--radius-md); flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  background:var(--card); color:var(--muted-foreground);}
.type-icon svg{width:20px; height:20px;}
.type--pro .type-icon{background:var(--primary-alpha-80); color:var(--primary-foreground);}
.type-price{display:flex; align-items:baseline; gap:var(--space-xs); flex-wrap:wrap; color:var(--foreground);}
.type-price s{color:var(--muted-foreground);}

/* ---------- secondary action + offer meta ---------- */
.btn-secondary{background:var(--card); color:var(--foreground); border:1px solid var(--border-strong);}
.btn-secondary:hover{background:var(--accent); color:var(--accent-foreground);}
.btn-secondary:active{background:var(--accent-hover);}
.btn-secondary:disabled{background:var(--card); border-color:var(--border); color:var(--fg-alpha-48);}
.offer-meta{display:flex; flex-direction:column; gap:var(--space-sm); margin:0; padding:0; list-style:none;}
.offer-meta li{display:flex; gap:var(--space-sm); align-items:flex-start; color:var(--foreground);}
.offer-meta svg{width:16px; height:16px; flex-shrink:0; margin-top:3px; stroke:var(--success); stroke-width:2.5;}
.offer.spent{opacity:.55;}

/* ---------- the build moment ----------
   Full screen, deliberately. The preview loader was kept inside the column because a
   takeover would have broken the chat metaphor for 3.5s of nothing; this is the one
   long wait with real work behind it, so it gets the screen. The chat underneath is
   hidden entirely — the wash is redrawn here so nothing shows through. */
/* ---------- the build, as part of the conversation ----------
   It used to take the whole screen. Her manager's call: in an AI chat the work belongs in
   the transcript, where it stays afterwards as a record of what was done. */
.working{margin:0 0 20px 40px; display:flex; flex-direction:column; gap:var(--space-md);}
.working-head{display:flex; align-items:center; gap:var(--space-sm); padding:0; border:0;
  background:none; font-family:inherit; text-align:left; color:inherit; cursor:default;}
.working-ic{display:flex; width:18px; height:18px; flex-shrink:0;}
.working-ic svg{width:18px; height:18px; color:var(--muted-foreground);}
.working-ic .tick{display:none;}
/* the icons inherit their colour from the svg, so the tick has to be coloured there */
.working-ic .tick svg{color:var(--success); stroke-width:2.5;}
/* finished, the list folds into its own header — the record stays, the bulk does not */
.working-meta, .working-chev{display:none;}
.working-meta{color:var(--muted-foreground);}
.working-chev svg{width:14px; height:14px; color:var(--muted-foreground); transition:transform 150ms;}
.working.done .working-head{cursor:pointer;}
.working.done .working-ic .brain{display:none;}
.working.done .working-ic .tick{display:block;}
.working.done .working-meta, .working.done .working-chev{display:flex;}
.working.done .working-list{display:none;}
.working.done.open .working-list{display:flex;}
.working.done.open .working-chev svg{transform:rotate(180deg);}
/* the rule hangs from the centre of the 18px icon above it */
.working-list{display:flex; flex-direction:column; gap:12px;
  margin-left:9px; padding-left:19px; border-left:1px solid var(--border);}
.working-row{display:flex; align-items:center; gap:var(--space-sm);}
.working-mk{width:16px; height:16px; flex-shrink:0; display:flex; align-items:center; justify-content:center;}
.working-mk i{width:14px; height:14px; border-radius:50%; box-sizing:border-box; border:1.5px solid var(--border-strong);}
.working-mk svg{display:none; width:16px; height:16px; stroke:var(--success); stroke-width:2.5;}
.working-row.active .working-mk i{border-color:var(--border); border-top-color:var(--primary);
  animation:spin .8s linear infinite;}
.working-row.done .working-mk i{display:none;}
.working-row.done .working-mk svg{display:block;}
/* the steps are supporting text under the header: one weight, one colour, the same
   Body/Small + muted-foreground pairing the progress pill and the path nodes use */
.working-label{color:var(--muted-foreground); min-width:0;}

/* ---------- 07 · what AutoDS is ----------
   Nobody arriving here has heard of AutoDS, so the card explains the product rather
   than the procedure: what it does for them, then what it costs. Measured off
   372:25278: the artwork bleeds to the card edge, so the card carries no padding of
   its own and the body holds its 24px. 411 + 24 + 405 is exactly the 842 the chat
   gives a block at this indent — no wrapper frame around the image. */
.autods{display:flex; align-items:center; gap:var(--space-xl); margin:0 0 20px 40px;
  width:842px; max-width:100%; overflow:hidden; border-radius:var(--radius-lg);
  background:var(--card); border:1px solid var(--border);}
.autods-shot{flex:0 0 411px; max-width:50%; display:block; height:auto;}
.autods-body{flex:1; min-width:0; display:flex; flex-direction:column; gap:var(--space-lg);
  padding:var(--space-xl) var(--space-xl) var(--space-xl) 0;}
.autods-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:12px;}
.autods-list li{display:flex; align-items:center; gap:var(--space-sm);}
/* Lucide at the design's 20px. The default 1.75 stroke on a 24 viewBox lands at
   ~1.46px here, which is where the set in the design file draws them. */
.autods-list svg{width:20px; height:20px; flex-shrink:0; display:block; color:var(--brand);}
.autods-price{display:flex; flex-direction:column; gap:var(--space-xs);
  padding-top:var(--space-lg); border-top:1px solid var(--border);}
.autods-price .then{color:var(--muted-foreground);}

/* ---------- 06b · the downsell ----------
   Measured off 413:6132. Same 842 skeleton as the AutoDS card, but the art is one
   flattened export rather than a CSS composition — the storefront fragment, the
   finished-work card and the proof chip are baked into `Container_downsell.png`, so
   there is one asset to keep in step with Figma instead of three positioned layers.
   The picture argues "already done"; the heading and the ribbon carry the offer. */
.pro{position:relative; display:flex; align-items:center; gap:var(--space-xl); margin:0 0 20px 40px;
  width:842px; max-width:100%; overflow:hidden; border-radius:var(--radius-lg);
  /* the same ring and shadow the Pro card wears on the store-type step — it is the same
     offer, so it should not arrive looking like a different class of thing */
  background:var(--card); border:1px solid var(--ring); box-shadow:var(--shadow-medium);}
/* the export is 411×352 and must stay at that size: as a flex item with a stretched
   cross size a replaced element grows on both axes, which quietly widened it to 420 */
.pro-art{flex:0 0 auto; align-self:center; display:block;
  width:411px; max-width:50%; height:auto;}
.pro-body{flex:1; min-width:0; display:flex; flex-direction:column; gap:var(--space-xl);
  padding:var(--space-xl) var(--space-xl) var(--space-xl) 0;}
.pro-top{display:flex; flex-direction:column; gap:var(--space-xl);}
/* Body/Default Emphasis, like every other card heading — the design had it at 600,
   which would have been a ninth weight for one line of text */
.pro-head{padding-right:var(--space-3xl);}
.pro-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:var(--space-md);}
.pro-list li{display:flex; align-items:center; gap:var(--space-sm);}
.pro-list svg{width:20px; height:20px; flex-shrink:0; color:var(--brand);}
.pro-price{display:flex; flex-direction:column; gap:var(--space-sm);
  padding-top:var(--space-lg); border-top:1px solid var(--border);}
.pro-now{display:flex; align-items:center; gap:var(--space-md); flex-wrap:wrap;}
.pro-pair{display:flex; align-items:center; gap:var(--space-xs);}
/* the old price is struck through in primary, not grey — the strike is the thing
   being pointed at, so it carries the accent rather than receding with the number */
.pro-was{position:relative; color:var(--muted-foreground);}
.pro-was::after{content:''; position:absolute; left:0; right:0; top:52%; height:1px; background:var(--primary);}
/* the clock has an object: it is not "hurry", it is the price being held */
.pro-clock{display:inline-flex; align-items:center; gap:6px; padding:5px 12px;
  border-radius:var(--radius-full); background:var(--primary-alpha-8); color:var(--primary);
  white-space:nowrap;}
.pro-clock svg{width:15px; height:15px;}
.pro-clock b{font-weight:600; font-variant-numeric:tabular-nums;}
.pro-terms{color:var(--muted-foreground);}
/* when it runs out the card has to give the price back, because unlike a landing page
   this one stays in the transcript. A countdown that lapses and changes nothing is the
   bluff we took out of this step in the first place. */
.pro.is-over .ribbon{display:none;}
.pro.is-over .pro-was{display:none;}
.pro.is-over .pro-clock{background:var(--muted); color:var(--muted-foreground);}
.pro.is-over .pro-art{filter:saturate(.45);}

/* the seven-step manual. Production prints it on the page, above a disabled
   "Complete the instruction to continue"; in a chat that is a wall in the middle of
   a conversation, so it sits behind a link and opens over the transcript for
   whoever gets stuck on AutoDS's own screens. */
.guide{list-style:none; counter-reset:g; margin:0; padding:0;
  display:flex; flex-direction:column; gap:var(--space-xl);}
.guide li{counter-increment:g; display:flex; flex-direction:column; gap:var(--space-md);}
/* the number hangs in the gutter rather than sitting in a flex row — a flex row
   would make the bolded button names their own items and space them out */
.guide p{margin:0; position:relative; padding-left:28px;}
.guide p::before{content:counter(g) "."; position:absolute; left:0; top:0;
  color:var(--muted-foreground);}
.guide b{font-weight:500;}
/* the box is reserved before the file arrives — without it each screenshot that
   loads shifts the list and the browser's scroll anchoring drags the modal down.
   1344/656 is the shots' own ratio: the production frame is 672×278 and stretches
   them ~15% taller than they are, which is an artefact of the paste, not a choice. */
.guide img{display:block; width:100%; height:auto; aspect-ratio:1344/656;
  border-radius:var(--radius-md); border:1px solid var(--border);}
/* the list is taller than the modal, so the title stays put while it passes — and so
   does the way out: the button is the last step, and nobody should have to scroll back
   through four screenshots to reach it */
/* the modal always opens at step one. Without this the browser's scroll anchoring
   keeps its own idea of where the content was and lands partway down the list. */
.modal--guide{overflow-anchor:none;}
.modal--guide .modal-head{position:sticky; top:calc(var(--space-2xl) * -1); z-index:1;
  margin:calc(var(--space-2xl) * -1) calc(var(--space-2xl) * -1) var(--space-xl);
  padding:var(--space-2xl) var(--space-2xl) var(--space-lg); background:var(--card);}
.modal--guide .modal-go{position:sticky; bottom:calc(var(--space-2xl) * -1); z-index:1;
  margin:var(--space-xl) calc(var(--space-2xl) * -1) calc(var(--space-2xl) * -1);
  padding:var(--space-lg) var(--space-2xl) var(--space-2xl); background:var(--card);
  border-top:1px solid var(--border);}

/* ---------- 08 · store live ----------
   Measured off 229:13948. A short preview rather than step 04's tall scrolling one —
   the store has been seen already, so this is a reminder, not a reveal. The product
   cards hang past the bottom edge, which is why they live outside the (clipping)
   preview rather than inside it. */
.live-view{position:relative; height:320px; overflow:hidden; background:var(--card);}
.live-view > img{display:block; width:100%; height:auto;}
/* The stack, taken off 229:16513 tile by tile. Four squares of 94, each with its own offset and
   tilt — the row is uneven on purpose. Every number here is read from the design, not chosen:
   x 0 / 91.8 / 165.4 / 250.9, y 9.5 / 0.4 / 5.9 / 0.4, tilt 5.8 / -5.3 / 1.7 / -5.3,
   radius 12.16, shadow 0 3.6 9.7 rgba(0,0,0,.18). Placed a quarter in from the left of the
   storefront, over the lower half of the hero, as the design places it. */
.live-products{position:absolute; left:24%; top:57%; width:344px; height:103px;}
/* the photos already carry their own white card and rounded corners, so the only thing added
   here is the shadow — as a drop-shadow, so it follows the cut-out instead of boxing it */
.live-card{position:absolute; width:94px; height:94px; display:block;
  filter:drop-shadow(0 3.6px 9.7px rgba(0,0,0,.18));}
.live-card--a{left:0;       top:9.5px; transform:rotate(5.8deg);}
.live-card--b{left:91.8px;  top:0.4px; transform:rotate(-5.3deg);}
.live-card--c{left:165.4px; top:5.9px; transform:rotate(1.7deg);}
/* the counter is the one tile we draw, so it needs the card the photos already have */
.live-more{left:250.9px; top:0.4px; transform:rotate(-5.3deg);
  background:var(--card); border-radius:12.16px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;}
/* the design sets "+7" in Bold; our scale has no Bold, so SemiBold — and foreground, not the
   design's pure black, which this system never uses */
.live-more b{font-size:18px; font-weight:600; line-height:18px; color:var(--foreground);}
.live-more span{font-size:14px; font-weight:400; line-height:20px; color:var(--foreground);}
.howto{margin:0 0 20px 40px; width:556px; max-width:100%; padding:var(--space-lg);
  border-radius:var(--radius-lg); background:var(--info-muted);
  display:flex; flex-direction:column; gap:var(--space-sm);}
.howto-path{color:var(--foreground);}
.howto-path u{text-underline-offset:3px;}

/* ---------- 10 · domain ----------
   Carried from the embedded app's three-phase step, with one inversion: the
   suggestions come first and the field only opens on request. */
/* the reassurance lines sit inside the assistant's own bubble now, not in a card
   of their own — so they read as part of what it is saying */
.bub-list{display:flex; flex-direction:column; gap:var(--space-sm);
  margin-top:var(--space-sm); padding-bottom:var(--space-sm);}
.bub-list div{display:flex; align-items:center; gap:var(--space-sm);}
.bub-list svg{width:20px; height:20px; flex-shrink:0; stroke:var(--primary);}

.dom-list{margin:0 0 0 40px; width:556px; max-width:100%; padding:0;
  border-radius:var(--radius-lg); background:var(--card); border:1px solid var(--border);}
.dom-row{display:flex; align-items:center; justify-content:space-between; gap:var(--space-lg);
  padding:var(--space-md) 20px;}
.dom-row + .dom-row{border-top:1px solid var(--border);}
.dom-get{height:32px; padding:0 var(--space-md); border:none; border-radius:var(--radius-full);
  background:var(--primary); color:var(--primary-foreground); cursor:pointer;
  font-family:inherit; font-size:14px; font-weight:500;}
.dom-get:hover{background:var(--primary-hover);}
/* A suggestion can fail. Availability is only true at the moment it is checked, so a
   name listed as free thirty seconds ago can be gone by the time it is clicked — and
   the merchant has to be told which one and why, on the row itself, rather than by the
   list quietly vanishing. Same destructive treatment as the typed field's error. */
.dom-row.err{background:var(--destructive-muted);}
.dom-row.err .dom-name{color:var(--destructive);}
.dom-taken{display:inline-flex; align-items:center; gap:6px; color:var(--destructive);}
.dom-taken svg{width:16px; height:16px; stroke:var(--destructive); stroke-width:2.2;}
.dom-get:disabled{background:var(--muted); color:var(--muted-foreground); cursor:default;}

/* After a failed check the choice has to come back BELOW the explanation: the chat runs
   downward, and live rows left sitting above the reply mean scrolling back up to act. One
   block — the name that died, the ones still free, and the open field. */
.dom-retry{margin:0 0 20px 40px; width:556px; max-width:100%;
  display:flex; flex-direction:column; gap:var(--space-md);}
.dom-retry .dom-list{margin:0; width:auto;}
.dom-retry.err .control, .dom-retry.err .control:focus-within{
  border-color:var(--destructive); box-shadow:none;}

.dom-other{margin:16px 0 20px 40px;}
.dom-other button{background:none; border:none; padding:0; cursor:pointer; font-family:inherit;
  color:var(--primary);}
.dom-other button:hover{color:var(--primary-hover);}
.dom-field{margin:0 0 20px 40px; width:556px; max-width:100%;
  display:flex; flex-direction:column; gap:var(--space-sm);}
/* the same field without a label of its own — the assistant has just asked the question,
   so repeating it above the box would say it twice */
.ask-field{margin:0 0 20px 40px; width:556px; max-width:100%;
  display:flex; flex-direction:column; align-items:flex-start; gap:var(--space-sm);}
.dom-input{display:flex; gap:var(--space-md); align-items:flex-start;}
.dom-input .control{flex:1;}
.dom-err{color:var(--destructive);}
.dom-field.err .control, .dom-field.err .control:focus-within{
  border-color:var(--destructive); box-shadow:none;}
.warnbox{margin:0 0 20px 40px; width:556px; max-width:100%; padding:var(--space-md) var(--space-lg);
  border-radius:var(--radius-md); background:var(--warning-muted); color:var(--warning-foreground);
  display:flex; gap:var(--space-sm);}
.warnbox svg{width:16px; height:16px; flex-shrink:0; margin-top:2px; stroke:var(--warning);}
.dom-steps{margin:0 0 12px 40px; width:556px; max-width:100%;
  display:flex; flex-direction:column; gap:var(--space-lg);}
.dom-step{display:flex; flex-direction:column; gap:var(--space-sm);}
.dom-step img{display:block; width:100%; height:auto; border-radius:var(--radius-md);
  border:1px solid var(--border);}

/* ---------- 11 · UGC, 12 · Course ----------
   Both steps show a 16:9 media block in production with no asset behind it yet —
   their own code renders it as a deliberate empty placeholder rather than a broken
   image, and this does the same. It marks where the asset goes. */
.media{margin:0 0 12px 40px; width:556px; max-width:100%; aspect-ratio:16/9;
  border-radius:var(--radius-lg); background:var(--muted); border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center; color:var(--muted-foreground);}

/* ---------- store preview ---------- */
.preview{position:relative; margin:0 0 8px 40px; background:var(--card); border:1px solid var(--border);
  border-radius:var(--radius-lg); box-shadow:var(--shadow-medium); overflow:hidden;}
.preview-chrome{display:flex; align-items:center; gap:var(--space-xs); height:39px; padding:0 16px;
  background:var(--card-muted); border-bottom:1px solid var(--border);}
.preview-chrome .dot{width:8px; height:8px; border-radius:50%; background:var(--border-strong);}
.preview-url{margin-left:8px; color:var(--muted-foreground);}
.preview-view{height:440px; overflow-y:auto; overflow-x:hidden; background:var(--card);}
.preview-view img{display:block; width:100%; height:auto;}
.preview-caption{margin:0 0 20px 40px; color:var(--muted-foreground); text-align:center;}

.fade-in{animation:fadeUp 240ms ease both;}
@keyframes fadeUp{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

/* Motion is opt-out. Everything that travels, shimmers or draws is switched off;
   the typing dots and the spinner stay, because there they ARE the message and
   nothing static says it as well. Both are small and move in place. */
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{
    animation-duration:1ms !important; animation-iteration-count:1 !important;
    transition-duration:1ms !important; scroll-behavior:auto !important;}
  .dots i{animation:blink 1.2s infinite ease-in-out !important;}
  .spin, .sheet-spin{animation:spin .8s linear infinite !important;}
}

::-webkit-scrollbar{width:10px;}
::-webkit-scrollbar-thumb{background:var(--gray-300); border-radius:var(--radius-full); border:2px solid var(--white);}

/* ---------------- progress: the checklist in the corner (Figma `Progress` 254:1318) ---------------- */
/* below every full-screen moment — the loader (25), the payment modal (30) and the
   handoff sheet (60). Progress is context, and context steps back when something takes
   over the screen. */
.prog-dock{position:fixed; right:24px; bottom:24px; z-index:20; display:flex; justify-content:flex-end;}
.prog-dock[hidden]{display:none;}

.prog-ring-wrap{position:relative; flex-shrink:0; display:block;}
.prog-ring-wrap svg{display:block;}
.prog-ring-track{stroke:var(--muted);}
.prog-ring-arc{stroke:var(--primary); transition:stroke-dashoffset 520ms cubic-bezier(.22,.61,.36,1);}
.prog-pct{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--foreground);}
.prog-copy{display:flex; flex-direction:column; align-items:flex-start; min-width:0;}
.prog-hint{color:var(--muted-foreground);}

.prog-pill{display:flex; align-items:center; gap:12px; padding:8px 16px 8px 8px; border:0;
  background:var(--card); border-radius:var(--radius-full); box-shadow:var(--shadow-medium);
  font-family:inherit; color:var(--foreground); cursor:pointer; text-align:left;
  transition:transform 160ms ease, box-shadow 160ms ease;}
.prog-pill:hover{transform:translateY(-1px);}
.prog-pill:focus-visible{outline:none; box-shadow:var(--shadow-medium), var(--focus-ring);}

.prog-panel{width:360px; background:var(--card); border-radius:var(--radius-xl);
  box-shadow:var(--shadow-medium); overflow:hidden;}
.prog-head{display:flex; align-items:flex-start; gap:16px; padding:24px;
  background:var(--card-muted); border-bottom:1px solid var(--border);}
.prog-head .prog-copy{flex:1; gap:4px;}
.prog-head .prog-hint{text-wrap:pretty;}
.prog-close{width:20px; height:20px; flex-shrink:0; padding:0; border:0; background:none;
  color:var(--muted-foreground); cursor:pointer;}
.prog-close svg{width:20px; height:20px; display:block;}
.prog-steps{padding:12px;}

.pstep{display:flex; align-items:center; gap:12px; height:44px; padding:0 8px;
  border-radius:var(--radius-md); border:0; width:100%; background:none; font-family:inherit;
  color:var(--foreground); text-align:left;}
button.pstep{cursor:pointer;}
button.pstep:hover{background:var(--muted);}
button.pstep:focus-visible{outline:none; box-shadow:var(--focus-ring);}
.pstep-ind{position:relative; width:24px; height:44px; flex:0 0 24px;}
.pstep-ind i.ln{position:absolute; left:11px; width:2px; background:var(--border);}
.pstep-ind i.ln.top{top:0; height:11px;}
.pstep-ind i.ln.bot{top:33px; height:11px;}
.pstep-cir{position:absolute; top:10px; left:0; width:24px; height:24px; border-radius:50%;
  box-sizing:border-box; background:var(--card); border:2px solid var(--border);
  display:flex; align-items:center; justify-content:center;}
.pstep-cir svg{width:14px; height:14px;}
.pstep-dot{width:6px; height:6px; border-radius:50%; background:var(--muted-foreground);}
.pstep-label{flex:1; min-width:0;}
.pstep-jump{width:20px; height:20px; flex-shrink:0; color:var(--muted-foreground);}
.pstep-jump svg{width:20px; height:20px; display:block;}
.pstep.first i.ln.top, .pstep.last i.ln.bot{display:none;}
.pstep.done .pstep-cir{background:var(--primary); border-color:var(--primary); color:var(--primary-foreground);}
.pstep.done i.ln{background:var(--primary);}
.pstep.current{background:var(--card-muted);}
.pstep.current .pstep-cir{border-color:var(--primary);}
.pstep.current i.ln.top{background:var(--primary);}
.pstep.upcoming .pstep-label{color:var(--muted-foreground);}

@media (prefers-reduced-motion: reduce){
  .prog-ring-arc{transition:none;}
  .prog-pill:hover{transform:none;}
}
</style>

  $('navLogo').innerHTML = BYS_LOGO;
  $('accountAvatar').innerHTML = ICON.user;
  $('accountChevron').innerHTML = ICON.chevronDown;

  /* ---------------- data ---------------- */
  const AI_PICK = 'Pet products';
  const NICHES = [
    { name: 'Pet products',        icon: ICON.paw },
    { name: 'Home &amp; living',   icon: ICON.sofa },
    { name: 'Fitness &amp; sport', icon: ICON.dumbbell },
    { name: 'Fashion &amp; apparel', icon: ICON.shirt },
    { name: 'Beauty &amp; skincare', icon: ICON.sparkles },
    { name: 'Tech &amp; gadgets',  icon: ICON.smartphone },
    { name: 'Let&rsquo;s AI decide', icon: ICON.wand }
  ];
  const DESIGNS = [1, 2, 3, 4, 5, 6].map(n => ({ name: 'Design ' + n, img: 'images/design-' + n + '.png' }));

  const state = { niche: '', aiPicked: false, designs: [], storeType: '', domain: '' };

  /* ---------------- chat primitives ---------------- */
  const add = (node) => { chat.appendChild(node); scrollBottom(); return node; };

  /* The view follows the assistant, not the bottom of the page. Pinning to the bottom on
     every append meant a tall block — a pair of cards and their buttons — pushed the line
     that introduced it off the top before it could be read. So: scroll as far as the
     bottom, but never past the point where the newest assistant turn sits at the top of
     the stage. Short turns behave exactly as before; tall ones stop and let you read down. */
  /* A step opens at the top of the screen; inside it the conversation runs downward. The
     unit is the step, not the line — "Did you activate the plan?" belongs to the step that
     offered the plan and should not jump over it.
     Opening at the top needs somewhere to scroll to, so an empty tail grows under the
     transcript — but only as far as a step shorter than the screen needs. Once a step is
     taller than the screen the tail is nothing and the view follows the bottom, so whatever
     just arrived stays visible. Measured against the stage rather than offsetTop: the offset
     parent is the shell, so offsetTop carries the nav height and lands the line under it. */
  let anchor = null;
  const ANCHOR_PAD = 40;
  const tail = el('<div aria-hidden="true"></div>');

  const scrollBottom = () => {
    chat.appendChild(tail);                 /* whatever was just added, the tail stays last */
    tail.style.height = '0px';
    if (!anchor || !anchor.isConnected) {
      stage.scrollTop = Math.max(0, stage.scrollHeight - stage.clientHeight);
      return;
    }
    const anchorTop = stage.scrollTop
      + (anchor.getBoundingClientRect().top - stage.getBoundingClientRect().top);
    const below = stage.scrollHeight - anchorTop;
    tail.style.height = Math.max(0, stage.clientHeight - ANCHOR_PAD - below) + 'px';
    /* and then simply to the bottom. The tail already encodes the rule: on a short step it is
       sized so that the bottom IS the step sitting 40px down, and on a step taller than the
       screen it is nothing, so the bottom is whatever just arrived. Choosing between the two
       with a min() was the bug — on a tall step it picked the step's start and left new
       content under the fold. */
    stage.scrollTop = Math.max(0, stage.scrollHeight - stage.clientHeight);
  };

  /* A block that is not a step, but should still open at the top of the screen. Dropping
     the anchor lets the next assistant turn claim it, exactly as the first line of a step
     does. The source question is the case: it belongs to no step, so without this it
     arrives underneath whichever step is still filling the view. */
  const startsFresh = () => { anchor = null; };

  function divider(text) {
    const d = el(`<div class="divider"><span class="t-label-section">${text}</span><i></i></div>`);
    anchor = d;
    const node = add(d);
    const n = parseInt(text, 10);
    if (n) progress.enter(n, node);
    return node;
  }

  /* ---------------- progress: the corner checklist (Figma `Progress` 254:1318) ----------------
     The steps are exactly the nine numbered dividers. The preview, the build loader and
     "How you found us" carry no number, so they are not steps — CONTEXT.md, 2026-09-10.
     The chevron on a finished step scrolls the transcript back to it. It does not rewind the
     flow: nothing is undone, you are just taken to where it happened. Whether a step should be
     genuinely re-openable is still a question for the manager. */
  const PROGRESS_STEPS = [
    'Choose your niche',
    'Pick your homepage design',
    'Activate your Shopify plan',
    'Choose your store type',
    'Add top-selling products',
    'Take your store live',
    'Secure your domain',
    'Claim your UGC offer',
    'Start your course'
  ];

  const progress = (() => {
    const TOTAL = PROGRESS_STEPS.length;
    const nodes = {};
    let current = 0, done = 0, open = false, shown = 0;
    const dock = el(`<div class="prog-dock" hidden></div>`);
    document.body.appendChild(dock);

    const pct = () => done / TOTAL;

    function ring(size, r, sw, value, cls) {
      const c = 2 * Math.PI * r, mid = size / 2;
      return `<span class="prog-ring-wrap" style="width:${size}px;height:${size}px">
          <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">
            <circle class="prog-ring-track" cx="${mid}" cy="${mid}" r="${r}" fill="none" stroke-width="${sw}"/>
            <circle class="prog-ring-arc" cx="${mid}" cy="${mid}" r="${r}" fill="none" stroke-width="${sw}"
              stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${(c * (1 - value)).toFixed(2)}"
              transform="rotate(-90 ${mid} ${mid})"/>
          </svg>
          <span class="prog-pct ${cls}">${Math.round(pct() * 100)}%</span>
        </span>`;
    }

    function rows() {
      return PROGRESS_STEPS.map((label, i) => {
        const n = i + 1;
        const st = n <= done ? 'done' : (n === current ? 'current' : 'upcoming');
        const edge = (i === 0 ? ' first' : '') + (i === PROGRESS_STEPS.length - 1 ? ' last' : '');
        const inner = st === 'done' ? ICON.check : (st === 'upcoming' ? '<i class="pstep-dot"></i>' : '');
        const canJump = !!nodes[n];
        const tag = canJump ? 'button' : 'div';
        const attrs = canJump ? ` type="button" data-step="${n}"` : '';
        return `<${tag} class="pstep ${st}${edge}"${attrs}>
            <span class="pstep-ind"><i class="ln top"></i><i class="ln bot"></i>
              <span class="pstep-cir">${inner}</span></span>
            <span class="pstep-label t-body-default${st === 'current' ? '-emph' : ''}">${label}</span>
            ${canJump ? `<span class="pstep-jump">${ICON.chevronRight}</span>` : ''}
          </${tag}>`;
      }).join('');
    }

    function render() {
      const all = done === TOTAL;
      dock.innerHTML = open
        ? `<div class="prog-panel fade-in">
             <div class="prog-head">
               ${ring(68, 31.4, 5.1, shown, 't-body-default-emph')}
               <span class="prog-copy">
                 <span class="t-body-default-emph">${all ? 'That&rsquo;s the lot.' : 'Keep it up!'}</span>
                 <span class="t-body-small prog-hint">${all
                    ? `All ${TOTAL} steps done.`
                    : `${done} of ${TOTAL} steps done &mdash; here&rsquo;s what&rsquo;s left.`}</span>
               </span>
               <button class="prog-close" type="button" aria-label="Close the checklist">${ICON.close}</button>
             </div>
             <div class="prog-steps">${rows()}</div>
           </div>`
        : `<button class="prog-pill" type="button" aria-label="Open your checklist">
             ${ring(56, 25.5, 5.05, shown, 't-label-assistant')}
             <span class="prog-copy">
               <span class="t-body-default-emph">${all ? `All ${TOTAL} steps done` : `Step ${current} of ${TOTAL}`}</span>
               <span class="t-body-small prog-hint">See your checklist</span>
             </span>
           </button>`;

      if (shown !== pct()) {
        const target = pct();
        const paint = () => {
          dock.querySelectorAll('.prog-ring-arc').forEach(arc => {
            const c = parseFloat(arc.getAttribute('stroke-dasharray'));
            arc.style.strokeDashoffset = (c * (1 - target)).toFixed(2);
          });
          shown = target;
        };
        REDUCED ? paint() : requestAnimationFrame(() => requestAnimationFrame(paint));
      }
    }

    dock.addEventListener('click', (e) => {
      e.stopPropagation();   /* render() replaces the clicked node, so the document
                                listener below would read it as a click outside */
      if (e.target.closest('.prog-pill')) { open = true; render(); return; }
      if (e.target.closest('.prog-close')) { open = false; render(); return; }
      const step = e.target.closest('.pstep[data-step]');
      if (step) {
        const node = nodes[step.dataset.step];
        open = false; render();
        if (node) stage.scrollTo({ top: node.offsetTop - 24, behavior: REDUCED ? 'auto' : 'smooth' });
      }
    });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && open) { open = false; render(); } });
    document.addEventListener('click', (e) => { if (open && !dock.contains(e.target)) { open = false; render(); } });

    return {
      enter(n, node) {
        nodes[n] = node;
        current = n;
        done = n - 1;
        dock.hidden = false;
        render();
      },
      finish() { done = TOTAL; current = 0; render(); }
    };
  })();

  /* Assistant waiting states — thresholds from the Figma component:
     <400ms nothing, 400ms dots, 2.5s Thinking (brain), 8s + reassurance line. */
  async function aiWait(ms) {
    if (ms < 400) { await sleep(ms); return; }
    const row = add(el(`<div class="ai-row"><div class="ai-avatar">${BYS_MARK}</div>
        <div class="ai-body"><div class="status"><div class="dots"><i></i><i></i><i></i></div></div></div></div>`));
    const status = row.querySelector('.status');
    const timers = [];
    if (ms > 2500) timers.push(setTimeout(() => {

  async function buildCeremony() {

      if (failBuild && i === 2) { rows[i].classList.remove('active'); return 'failed'; }

    block.classList.add('done');

  function domainRows(names, taken) {

  function domainRetry(all, dead, taken) {
    return new Promise(resolve => {
      const rest = all.filter(d => d !== dead);
      const box = add(el(`<div class="dom-retry fade-in">
          <div class="dom-list">
            ${dead ? `<div class="dom-row err"><span class="dom-name t-body-default">${dead}</span>

     as the interface twitching rather than someone helping. And the names arrive with it,

  function domainField(taken, alts, announce) {

        const raw = input.value.trim().toLowerCase();

        const name = raw.endsWith('.store') ? raw : raw + '.store';
        if (!taken.includes(name)) return finish(name);

        err.hidden = false;

          </div>
        </div>
        <div class="path">
          <div class="path-node done"><div class="path-circle">${ICON.check}</div><div class="path-label t-body-small">Store built on<span>BuildYourStore</span></div></div>
          <div class="path-node active" id="pathNode2"><div class="path-circle">${ICON.click}</div><div class="path-label t-body-small">Activate plan on<span>Shopify</span></div></div>
          <div class="path-node next" id="pathNode3"><div class="path-circle path-circle--mark">${BYS_MARK}</div><div class="path-label t-body-small">Finish setup on<span>BuildYourStore</span></div></div>
        </div>
        <div class="path-foot t-body-small">Opens in a new tab. Finish on Shopify, then come back here and tell me.</div>
      </div>`));


    add(el(`<div class="cta-row fade-in">
        <button class="btn" id="activateBtn" type="button">Activate on Shopify ${ICON.squareArrowOutUpRight}</button>
        <span class="cta-reassure t-body-small">${ICON.check}Cancel anytime</span>
      </div>`));


    const activateBtn = document.getElementById('activateBtn');
    await new Promise(resolve => activateBtn.addEventListener('click', resolve, { once: true }));
    activateBtn.disabled = true;
    callMeBack(true);   // the tab itself asks to be returned to

    /* handoff + waiting for the return leg */
    offer.classList.add('spent');                 // the card is history now
    const shopUrl = storeUrl.split('.')[0] + ' · shopify.com/admin/charges';
    await handoff(shopUrl, 'Opening Shopify to approve the plan…', 1300);

    /* "Yes" is a claim, not a fact: the click fires a real request to Shopify, and
       so does every retry. Nothing here can talk its way past the check. */
    let outcome = await confirmActivation(shopUrl);
    let attempt = 0;

    while (outcome !== 'published') {
      if (outcome === 'reopen') { outcome = await confirmActivation(shopUrl); attempt = 0; continue; }

      const work = add(el(`<div class="waiting fade-in">
          <div class="waiting-row t-body-small"><span class="spin"></span><span></span></div>
        </div>`));
      const label = work.querySelector('.waiting-row span:last-child');
      label.innerHTML = attempt === 0 ? 'Checking your plan on Shopify&hellip;' : 'Checking again&hellip;';
      await sleep(1500);

      if (failPublish) {
        work.remove();
        outcome = await planNotFound(shopUrl, ++attempt);
        continue;
      }

      label.innerHTML = 'Activating your plan&hellip;';
      await sleep(2000);

      /* the row that did the work reports the result and stays — a second banner
         would announce the same fact twice, out of sync with the path animation */
      const done = work.querySelector('.waiting-row');
      done.innerHTML = `${ICON.check}<span>Plan active</span>`;
      done.classList.add('done');
      completePath();
      outcome = 'published';
    }

    /* the plan is the gate, not the finish — the conversation moves straight on */
    divider('04 · Store type');
    /* The free card is gone from this step, so "how do you want your store built?" was
       asking about a choice no longer on screen. The sell is one bubble and the ask is
       another: a question the merchant can answer is what makes the two buttons an
       answer rather than an interruption. Active voice with the doer named — they pick,
       they build — and the value stated as the merchant's own contrast: finished, rather
       than something still left to finish. It also says out loud that this is a
       ONE-product store — they just previewed a ten-product one, and that difference
       was nowhere on the step. */
    await ai(`There&rsquo;s a version our team builds for you: they pick one product that&rsquo;s already selling, then build your whole ${state.niche} store around it.`, 900);
    await ai('You get it finished &mdash; not something you still have to finish yourself. Want us to build it?', 500);

    let storeType = await askStoreType();
    you(storeType === 'pro' ? 'Continue like the pros' : 'Keep the free store');

    /* The downsell fires on whichever way they end up declining, and only once.
       No "are you sure" before it any more: that claimed the Pro store could never be
       unlocked again and then unlocked it a line later, which spends trust to buy
       nothing. There are two ways to say no — the button here, and opening the payment
       and closing it again — and the second one is the more interesting of the two,
       because they wanted it enough to get that far. It used to get nothing. */
    let offered = false;
    const downsell = async () => {
      if (offered) return 'free';
      offered = true;
      return offerDownsell();
    };
    if (storeType === 'free') storeType = await downsell();

    /* paying is a modal, because a card form is a task, not a turn in a conversation */
    while (storeType === 'pro' || storeType === 'pro47') {
      const paid = await paymentModal(storeType === 'pro47' ? 47 : 97);
      if (paid === 'paid') break;
      await ai('No rush &mdash; tell me when you&rsquo;re ready.', 500);
      const again = await askButtons(['Open payment again', 'Keep the free store']);
      you(again);
      if (again.indexOf('free') > -1) {
        storeType = await downsell();
        if (storeType === 'free') break;
      }
    }

    state.storeType = storeType;

    const paid = storeType === 'pro' || storeType === 'pro47';
    await ai(paid
      ? `Payment received. Now I&rsquo;ll build your ${state.niche} store.`
      : `Got it &mdash; you keep the free 10-product ${state.niche} store. Let me put it together.`, 600);

    let built = await buildCeremony();
    while (built === 'failed') {
      await ai('I couldn&rsquo;t finish building your store.', 600);
      you(await askButtons(['Try again']));
      built = await buildCeremony();
    }
    /* No "your store is built" line — the block folds into "Built your store · 6 steps" and
       says it already. Just a beat, so that lands before the next step arrives. */
    await sleep(REDUCED ? 200 : 900);
    await addProducts();
  }

  $('statesBtn').addEventListener('click', () => {
    divider('Assistant states — prototype reference');
    add(el(`<div class="states-ref fade-in">
        <div class="state-item">
          <div class="demo"><div class="status"><div class="dots"><i></i><i></i><i></i></div></div></div>
          <div class="meta t-caption">Typing — from 400ms. Under 400ms nothing is shown at all, otherwise the indicator just flickers.</div>
        </div>
        <div class="state-item">
          <div class="demo"><div class="status"><div class="status-row">${ICON.brain}<span class="status-label t-body-small shimmer-text">Thinking&hellip;</span></div></div></div>
          <div class="meta t-caption">Thinking — from 2.5s. The pause gets a name so it reads as work, not a stall.</div>
        </div>
        <div class="state-item">
          <div class="demo"><div class="status"><div class="status-row">${ICON.brain}<span class="status-label t-body-small shimmer-text">Thinking&hellip;</span></div>
            <div class="status-note t-caption">Still thinking — this one&rsquo;s taking a moment</div></div></div>
          <div class="meta t-caption">Slow — from 8s. One honest reassurance line; at 20s the flow falls through to the error state.</div>
        </div>
      </div>`));
  });

  /* prototype switch, so the publish-failure state can be reviewed without faking a flow */
  let failPublish = false;
  let failBuild = false;
  $('buildBtn').addEventListener('click', () => {
    failBuild = !failBuild;
    $('buildBtn').classList.toggle('on', failBuild);
    $('buildBtn').textContent = failBuild ? 'Build: fails' : 'Build: works';
  });
  $('publishBtn').addEventListener('click', () => {
    failPublish = !failPublish;
    $('publishBtn').classList.toggle('on', failPublish);
    $('publishBtn').textContent = failPublish ? 'Publish: fails' : 'Publish: works';
  });

  let domainTaken = false;
  $('domainBtn').addEventListener('click', () => {
    domainTaken = !domainTaken;
    $('domainBtn').classList.toggle('on', domainTaken);
    $('domainBtn').textContent = domainTaken ? 'Domain: taken' : 'Domain: free';
  });

  let shortOffer = false;
  $('offerBtn').addEventListener('click', () => {
    shortOffer = !shortOffer;
    $('offerBtn').classList.toggle('on', shortOffer);
    $('offerBtn').textContent = shortOffer ? 'Offer: 10 sec' : 'Offer: 10 min';
  });

  $('restartBtn').addEventListener('click', () => location.reload());
  run();
})();
</script>
