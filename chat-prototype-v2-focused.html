<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>BYS Chat Prototype V2</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  html,body{height:100%;}
  [hidden]{display:none !important;}
  :root{
    --bg:#FAF6F4;
    --surface:#FFFFFF;
    --surface-alt:#F4EDEA;
    --border:#E9DFDA;
    --ink:#303030;
    --ink-soft:#736A67;
    --ink-faint:#A79E9A;
    --pink:#FE0161;
    --pink-tint:#FFE3EE;
    --pink-tint-strong:#FFC1DA;
    --teal:#00AD94;
    --teal-deep:#009A7A;
    --teal-tint:#E1F5F0;
    --user-bubble-bg:#303030;
    --user-bubble-text:#FFFFFF;
    --shadow: 0 1px 2px rgba(48,32,32,.04), 0 8px 24px -12px rgba(48,32,32,.12);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1A1616; --surface:#221D1D; --surface-alt:#2A2423; --border:#3A3231;
      --ink:#F3ECE9; --ink-soft:#B9ADA9; --ink-faint:#877C79;
      --pink:#FF4785; --pink-tint:#3D1B29; --pink-tint-strong:#552237;
      --teal:#2BC5A9; --teal-deep:#1FA98F; --teal-tint:#12332C;
      --user-bubble-bg:#2A2423; --user-bubble-text:#F3ECE9;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#1A1616; --surface:#221D1D; --surface-alt:#2A2423; --border:#3A3231;
    --ink:#F3ECE9; --ink-soft:#B9ADA9; --ink-faint:#877C79;
    --pink:#FF4785; --pink-tint:#3D1B29; --pink-tint-strong:#552237;
    --teal:#2BC5A9; --teal-deep:#1FA98F; --teal-tint:#12332C;
    --user-bubble-bg:#2A2423; --user-bubble-text:#F3ECE9;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box;}
  body{background:var(--bg);color:var(--ink);font-family:'Poppins',system-ui,sans-serif;line-height:1.5;margin:0;overflow:hidden;}
  button{font-family:inherit;}
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace;}

  .page{height:100vh;display:flex;flex-direction:column;}

  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 20px;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0;}
  .brandmark{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;}
  .brandmark .dot{width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--teal));}
  .brandmark .tag{font-size:10.5px;font-weight:600;color:var(--teal-deep);background:var(--teal-tint);padding:3px 9px;border-radius:100px;text-transform:uppercase;letter-spacing:.04em;}
  .restart-btn{font-family:'Poppins',sans-serif;font-size:12.5px;font-weight:600;color:var(--ink-soft);background:var(--surface);border:1px solid var(--border);border-radius:100px;padding:7px 14px;cursor:pointer;}
  .restart-btn:hover{color:var(--ink);border-color:var(--ink-faint);}
  .restart-btn:focus-visible{outline:2px solid var(--teal);outline-offset:2px;}

  .mockup-shell{
    display:grid;grid-template-columns:220px 1fr;gap:0;
    background:var(--surface);
    flex:1;min-height:0;
  }
  .rail{background:var(--surface-alt);padding:20px 16px;display:flex;flex-direction:column;gap:12px;border-right:1px solid var(--border);flex-shrink:0;overflow-y:auto;}
  .rail-brand{background:#fff;border:1px solid var(--border);border-radius:10px;padding:9px 12px;display:flex;align-items:center;margin-bottom:8px;}
  .rail-brand svg{height:18px;width:auto;display:block;}
  .rail .rail-label{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);font-weight:600;margin-bottom:2px;}
  .rail-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--border);font-size:14px;opacity:0;transform:translateY(4px);transition:opacity .3s ease,transform .3s ease,background .25s,border-color .25s;}
  .rail-item.shown{opacity:1;transform:none;}
  .rail-item .rk{color:var(--ink-soft);}
  .rail-item .rv{font-weight:600;color:var(--ink);}
  .rail-item.pending{border-color:var(--pink-tint-strong);background:var(--pink-tint);}
  .rail-item.pending .rv{color:var(--pink);}
  .rail-item.done .rv::after{content:" \2713";color:var(--teal-deep);}
  .rail-empty{font-size:13.5px;color:var(--ink-faint);font-style:italic;line-height:1.5;}
  @media (prefers-reduced-motion:reduce){.rail-item{transition:none;}}

  .chatcol{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg);}
  .chat-topbar{display:flex;align-items:center;gap:10px;padding:14px 24px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--surface);}
  .ai-avatar{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--teal),var(--pink));display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;flex-shrink:0;}
  .chat-topbar .name{font-size:15px;font-weight:600;}
  .chat-topbar .sub{font-size:13px;color:var(--ink-faint);}

  /* single-focus stage: only the current step is ever in the DOM */
  .chat-body{padding:24px;display:flex;flex-direction:column;overflow-y:auto;flex:1;min-height:0;}
  .stage-outer{max-width:900px;margin:0 auto;width:100%;flex:1;display:flex;flex-direction:column;justify-content:flex-start;padding-top:56px;}
  #stageInner{display:flex;flex-direction:column;gap:16px;transition:opacity .22s ease, transform .22s ease;}
  #stageInner.leaving{opacity:0;transform:translateY(-8px);}

  .msg-row{display:flex;gap:12px;max-width:88%;}
  .msg-row.ai{align-self:flex-start;}
  .msg-row.user{align-self:flex-end;flex-direction:row-reverse;max-width:76%;}
  .avatar-sm{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--teal),var(--pink));flex-shrink:0;margin-top:2px;}
  .bubble{background:var(--surface);border:1px solid var(--border);border-radius:16px 16px 16px 4px;padding:13px 18px;font-size:17px;line-height:1.5;box-shadow:var(--shadow);}
  .msg-row.user .bubble{background:var(--user-bubble-bg);color:var(--user-bubble-text);border-radius:16px 16px 4px 16px;border-color:var(--user-bubble-bg);}
  .typing-bubble{display:inline-flex;background:var(--surface);border:1px solid var(--border);border-radius:16px 16px 16px 4px;padding:14px 18px;}
  .dots{display:flex;gap:5px;}
  .dots i{width:7px;height:7px;border-radius:50%;background:var(--ink-faint);display:inline-block;animation:bounce 1.1s infinite ease-in-out;}
  .dots i:nth-child(2){animation-delay:.15s;} .dots i:nth-child(3){animation-delay:.3s;}
  @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5;}30%{transform:translateY(-3px);opacity:1;}}
  @media (prefers-reduced-motion:reduce){.dots i{animation:none;} .fb-spinner{animation:none;border-top-color:var(--ink-faint);} #stageInner{transition:none;}}

  .phase-divider{display:flex;align-items:center;gap:10px;margin:0 0 8px;}
  .phase-divider .pd-label{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--teal-deep);background:var(--teal-tint);padding:5px 12px;border-radius:100px;white-space:nowrap;}
  .phase-divider .pd-line{flex:1;height:1px;background:var(--border);}

  .sys-divider{align-self:center;font-size:13.5px;color:var(--ink-faint);background:var(--surface-alt);padding:6px 14px;border-radius:100px;}

  .chip-row{display:flex;gap:10px;flex-wrap:wrap;margin-left:38px;}
  .chip{font-family:'Poppins',sans-serif;font-size:15.5px;font-weight:500;padding:11px 18px;border-radius:100px;border:1px solid var(--border);background:var(--surface);color:var(--ink);cursor:pointer;transition:opacity .2s;}
  .chip:hover:not(:disabled){border-color:var(--teal);}
  .chip:focus-visible{outline:2px solid var(--teal);outline-offset:2px;}
  .chip.primary{border-color:var(--teal);color:var(--teal-deep);background:var(--teal-tint);}
  .chip:disabled{cursor:default;}

  .banner-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-left:38px;max-width:760px;}
  .banner-chip{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface);cursor:pointer;padding:0;text-align:left;font-family:inherit;position:relative;line-height:0;}
  .banner-chip:focus-visible{outline:2px solid var(--teal);outline-offset:2px;}
  .banner-chip .b-thumb{aspect-ratio:16/9;width:100%;background:var(--surface-alt);background-size:cover;background-position:center;}
  .banner-chip .b-select{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:50%;background:rgba(30,26,24,.25);border:2px solid rgba(255,255,255,.9);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff;line-height:1;transition:background .2s,border-color .2s;}
  .banner-chip.selected{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal) inset;}
  .banner-chip.selected .b-select{background:var(--teal);border-color:var(--teal);}

  .card-bubble{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);max-width:360px;}
  .card-bubble h4{font-size:18px;font-weight:600;margin:0 0 10px;line-height:1.3;}
  .card-bubble ul{margin:0 0 16px;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:8px;}
  .card-bubble li{font-size:15px;color:var(--ink-soft);padding-left:18px;position:relative;}
  .card-bubble li::before{content:"\2013";position:absolute;left:0;color:var(--ink-faint);}
  .btn{display:inline-flex;align-items:center;gap:6px;font-family:'Poppins',sans-serif;font-weight:600;font-size:15.5px;border-radius:10px;padding:12px 18px;border:none;cursor:pointer;width:100%;justify-content:center;}
  .btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
  .btn-primary{background:var(--pink);color:#fff;}
  .card-foot{font-size:12.5px;color:var(--ink-faint);margin-top:12px;text-align:center;}

  /* hero store-preview reveal (step 04) */
  .store-preview-wrap{width:680px;max-width:100%;}
  .store-preview{border:1px solid var(--border);border-radius:16px;overflow:hidden;background:var(--surface);box-shadow:0 4px 8px rgba(48,32,32,.06), 0 24px 48px -20px rgba(48,32,32,.22);}
  .sp-browser-bar{display:flex;align-items:center;gap:6px;padding:10px 14px;background:var(--surface-alt);border-bottom:1px solid var(--border);}
  .sp-dot{width:8px;height:8px;border-radius:50%;background:var(--border);display:inline-block;}
  .sp-url{margin-left:8px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-faint);}
  .sp-nav{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--border);}
  .sp-logo{font-weight:700;font-size:15px;letter-spacing:-.01em;}
  .sp-navlinks{font-size:13.5px;color:var(--ink-soft);}
  .sp-cart{font-size:16px;}
  .sp-hero{position:relative;height:220px;background:linear-gradient(135deg,var(--teal-tint),var(--pink-tint));display:flex;align-items:center;padding:0 32px;}
  .sp-hero-eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--teal-deep);margin-bottom:8px;}
  .sp-hero-title{font-size:25px;font-weight:700;line-height:1.2;max-width:300px;color:var(--ink);text-wrap:balance;}
  .sp-hero-cta{display:inline-block;margin-top:16px;background:var(--ink);color:var(--bg);font-size:13.5px;font-weight:600;padding:10px 20px;border-radius:100px;}
  .sp-products{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:20px 24px;}
  .sp-product-img{height:80px;border-radius:8px;background:var(--surface-alt);margin-bottom:8px;}
  .sp-product-img.a{background:linear-gradient(135deg,#FFE3EE,#FFC1DA);}
  .sp-product-img.b{background:linear-gradient(135deg,#E1F5F0,#C7ECE3);}
  .sp-product-img.c{background:linear-gradient(135deg,#F4EDEA,#E9DFDA);}
  .sp-product-name{font-size:13px;font-weight:600;color:var(--ink);}
  .sp-product-price{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .sp-caption{font-size:13.5px;color:var(--ink-faint);margin-top:12px;text-align:center;}

  .inline-preview-row{display:flex;gap:14px;margin-left:38px;align-items:flex-start;}
  .mini-site{width:92px;height:64px;flex-shrink:0;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;}
  .mini-site.big{width:220px;height:130px;}
  .msite-head{height:12px;background:var(--surface-alt);display:flex;align-items:center;gap:3px;padding:0 5px;flex-shrink:0;}
  .msite-head i{width:4px;height:4px;border-radius:50%;background:var(--border);display:inline-block;}
  .msite-hero{flex:1;background:var(--surface-alt);transition:background .4s;}
  .msite-hero.filled{background:linear-gradient(135deg,var(--teal-tint),var(--pink-tint));}
  .msite-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:4px;height:16px;flex-shrink:0;}
  .mini-site.big .msite-grid{height:26px;}
  .msite-grid span{background:var(--surface-alt);border-radius:3px;transition:background .4s,border-color .4s;}
  .msite-grid span.filled{background:var(--teal-tint);border:1px solid var(--teal);}
  .step-text-col{display:flex;flex-direction:column;gap:8px;padding-top:4px;justify-content:center;}
  .step-text{font-size:15px;color:var(--ink-soft);}

  .handoff-overlay{position:fixed;inset:0;background:rgba(20,16,16,.55);display:flex;align-items:center;justify-content:center;z-index:50;}
  .fake-browser{width:280px;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.4);}
  .fake-browser-bar{background:#ECECEC;padding:8px 10px;display:flex;align-items:center;gap:5px;}
  .fb-dot{width:7px;height:7px;border-radius:50%;background:#D2D2D2;display:inline-block;}
  .fb-url{margin-left:6px;font-size:10.5px;color:#666;font-family:'JetBrains Mono',monospace;}
  .fake-browser-body{padding:30px 18px;display:flex;flex-direction:column;align-items:center;gap:12px;}
  .fb-spinner{width:24px;height:24px;border-radius:50%;border:3px solid #E4E4E4;border-top-color:#95BF47;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .fb-text{font-size:12.5px;color:#303030;font-family:'Poppins',sans-serif;text-align:center;}

  .end-note{margin:14px 0 0 38px;font-size:13.5px;color:var(--ink-faint);font-style:italic;}

  @media (max-width:640px){
    .mockup-shell{grid-template-columns:1fr;height:auto;}
    .rail{flex-direction:row;flex-wrap:wrap;border-right:none;border-bottom:1px solid var(--border);}
  }
</style>

      <div class="rail-label">What I know so far</div>
      <div class="rail-empty" id="railEmpty">Nothing yet — this fills in as we go</div>
    </div>
    <div class="chatcol">
      <div class="chat-topbar">
        <div class="ai-avatar">&#10022;</div>
        <div><div class="name">AI Assistant</div><div class="sub">BuildYourStore</div></div>
      </div>
      <div class="chat-body" id="chatBody">
        <div class="stage-outer"><div id="stageInner"></div></div>
      </div>
    </div>
  </div>
</div>

<div class="handoff-overlay" id="handoffOverlay" hidden>
  <div class="fake-browser">
    <div class="fake-browser-bar"><span class="fb-dot"></span><span class="fb-dot"></span><span class="fb-dot"></span><span class="fb-url" id="fbUrl">shopify.com/admin/charges</span></div>
    <div class="fake-browser-body">
      <div class="fb-spinner"></div>
      <div class="fb-text" id="fbText">Confirming your Shopify plan&hellip;</div>
    </div>
  </div>
</div>

<script>
(function(){
  const body = document.getElementById('chatBody');
  const stageInner = document.getElementById('stageInner');
  const overlay = document.getElementById('handoffOverlay');
  let beat = 0;

  function nextDelay(){
    const d = Math.max(280, 900 - beat*110);
    beat++;
    return d;
  }
  function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
  function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }
  function scrollBottom(){ body.scrollTop = body.scrollHeight; }
  function add(node){ stageInner.appendChild(node); scrollBottom(); return node; }

  /* single-focus stage: everything currently on screen belongs to one phase.
     Starting a new phase clears the previous one (after a short beat so the
     user's last answer is still readable) instead of appending to a growing log. */
  async function clearStage(){
    if (stageInner.children.length){
      await sleep(450);
      stageInner.classList.add('leaving');
      await sleep(220);
      stageInner.innerHTML = '';
      stageInner.classList.remove('leaving');
    }
  }
  async function divider(text){
    await clearStage();
    add(el(`<div class="phase-divider"><span class="pd-label">${text}</span><span class="pd-line"></span></div>`));
  }

  async function aiTyping(ms){
    const row = add(el(`<div class="msg-row ai"><div class="avatar-sm"></div><div class="typing-bubble"><div class="dots"><i></i><i></i><i></i></div></div></div>`));
    await sleep(ms);
    row.remove();
  }
  async function aiMsg(html){
    await aiTyping(nextDelay());
    add(el(`<div class="msg-row ai"><div class="avatar-sm"></div><div class="bubble">${html}</div></div>`));
  }
  async function aiCard(innerHtml){
    await aiTyping(nextDelay());
    return add(el(`<div class="msg-row ai"><div class="avatar-sm"></div>${innerHtml}</div>`));
  }
  function userMsg(text){
    add(el(`<div class="msg-row user"><div class="avatar-sm" style="visibility:hidden"></div><div class="bubble">${text}</div></div>`));
  }
  function waitForChoice(options){
    return new Promise(resolve=>{
      const row = el(`<div class="chip-row"></div>`);
      options.forEach(opt=>{
        const chip = el(`<button class="chip" type="button">${opt}</button>`);
        chip.addEventListener('click', ()=>{
          row.querySelectorAll('.chip').forEach(c=>c.disabled=true);
          row.remove();
          resolve(opt);
        });
        row.appendChild(chip);
      });
      add(row);
    });
  }
  function waitForBanners(){
    return new Promise(resolve=>{
      const wrap = el(`<div class="banner-grid"></div>`);
      const names=['Banner 1','Banner 2','Banner 3','Banner 4','Banner 5','Banner 6'];
      const images=['images/banner-1.jpg','images/banner-2.jpg','images/banner-3.jpg','images/banner-4.jpg','images/banner-5.jpg','images/banner-6.jpg'];
      const selected = [];
      names.forEach((name, i)=>{
        const chip = el(`<button class="banner-chip" type="button" aria-label="${name}"><div class="b-thumb" style="background-image:url('${images[i]}')"></div><span class="b-select"></span></button>`);
        chip.addEventListener('click', ()=>{
          const idx = selected.indexOf(name);
          if(idx>-1){
            selected.splice(idx,1);
            chip.classList.remove('selected');
            chip.querySelector('.b-select').textContent = '';
          } else {
            if(selected.length>=2) return;
            selected.push(name);
            chip.classList.add('selected');
            chip.querySelector('.b-select').textContent = '✓';
          }
          contBtn.disabled = selected.length!==2;
          contBtn.classList.toggle('primary', selected.length===2);
          contBtn.style.opacity = selected.length===2 ? '1' : '.4';
        });
        wrap.appendChild(chip);
      });
      add(wrap);
      const contRow = el(`<div class="chip-row"></div>`);
      const contBtn = el(`<button class="chip" type="button" disabled style="opacity:.4;">Continue →</button>`);
      contBtn.addEventListener('click', ()=>{
        contRow.remove();
        resolve(selected.slice());
      });
      contRow.appendChild(contBtn);
      add(contRow);
    });
  }

  let previewRow = null;
  async function previewStep(text, {hero, grid}={}){
    await aiTyping(nextDelay());
    if(!previewRow){
      previewRow = el(`<div class="inline-preview-row"><div class="mini-site"><div class="msite-head"><i></i><i></i><i></i></div><div class="msite-hero"></div><div class="msite-grid"><span></span><span></span><span></span></div></div><div class="step-text-col"></div></div>`);
      add(previewRow);
    }
    if(hero) previewRow.querySelector('.msite-hero').classList.add('filled');
    if(grid) previewRow.querySelectorAll('.msite-grid span').forEach(s=>s.classList.add('filled'));
    previewRow.querySelector('.step-text-col').appendChild(el(`<div class="step-text">${text}</div>`));
    scrollBottom();
  }

  const rail = document.getElementById('rail');
  function raceButtonVsChip(buttonEl, chipLabels){
    return new Promise(resolve=>{
      const row = el(`<div class="chip-row"></div>`);
      const chips = chipLabels.map(label=>{
        const chip = el(`<button class="chip" type="button">${label}</button>`);
        row.appendChild(chip);
        return chip;
      });
      add(row);
      let done = false;
      function finish(kind, label){
        if (done) return;
        done = true;
        buttonEl.disabled = true;
        chips.forEach(c=>c.disabled=true);
        row.remove();
        resolve({ kind, label });
      }
      buttonEl.addEventListener('click', ()=>finish('button', buttonEl.textContent), {once:true});
      chips.forEach(chip=>{
        chip.addEventListener('click', ()=>finish('chip', chip.textContent));
      });
    });
  }

  async function showHandoff(urlLabel, statusText, ms){
    document.getElementById('fbUrl').textContent = urlLabel;
    document.getElementById('fbText').textContent = statusText;
    overlay.hidden = false;
    await sleep(ms);
    overlay.hidden = true;
  }

  const railEmpty = document.getElementById('railEmpty');
  function addRailItem(id, key, value, pending){
    if(railEmpty) railEmpty.remove();
    const item = el(`<div class="rail-item ${pending?'pending':'done'}" id="rail-${id}"><span class="rk">${key}</span><span class="rv">${value}</span></div>`);
    rail.appendChild(item);
    requestAnimationFrame(()=>requestAnimationFrame(()=>item.classList.add('shown')));
  }
  function resolveRailItem(id, value){
    const item = document.getElementById('rail-'+id);
    item.classList.remove('pending');
    item.classList.add('done');
    item.querySelector('.rv').textContent = value;
  }

  async function run(){
    await divider('01 · Niche');
    await aiMsg('Hey! Let’s build your store — first, what do you want to sell?');
    const niche = await waitForChoice(['Pet products','Home & Living','Fitness & Sport','Fashion & Apparel','Beauty & Skincare','Tech & Gadgets','Not sure yet']);
    userMsg(niche);
    addRailItem('niche', 'Niche', niche);

    await divider('02 · Banners');
    await aiMsg(`Good pick. Here are a few homepage looks for a ${niche} store — choose two:`);
    const banners = await waitForBanners();
    userMsg(banners.join(' + '));
    addRailItem('banners', 'Banners', banners.length+' selected');

    await divider('03 · Building — live preview');
    await previewStep('“Applying your niche…”');
    await previewStep('“Adding your banners…”', {hero:true});
    await previewStep('“Laying out your homepage…”', {grid:true});
    await previewStep('“Finishing touches…” ✓');
    addRailItem('store', 'Store draft', 'Ready');

    await divider('04 · Preview');
    await aiMsg('Here’s a first look at your store 👀');
    const nicheSlug = niche.toLowerCase().replace(/[^a-z0-9]+/g, '') || 'yourstore';
    await aiCard(`<div class="store-preview-wrap">
        <div class="store-preview">
          <div class="sp-browser-bar"><span class="sp-dot"></span><span class="sp-dot"></span><span class="sp-dot"></span><span class="sp-url">${nicheSlug}.myshopify.com</span></div>
          <div class="sp-nav"><span class="sp-logo">${niche}</span><span class="sp-navlinks">Shop · About · Contact</span><span class="sp-cart">🛒</span></div>
          <div class="sp-hero">
            <div>
              <div class="sp-hero-eyebrow">New arrivals</div>
              <div class="sp-hero-title">Everything for your ${niche.toLowerCase()}</div>
              <div class="sp-hero-cta">Shop Now</div>
            </div>
          </div>
          <div class="sp-products">
            <div><div class="sp-product-img a"></div><div class="sp-product-name">Bestseller</div><div class="sp-product-price">$24.99</div></div>
            <div><div class="sp-product-img b"></div><div class="sp-product-name">New in</div><div class="sp-product-price">$18.50</div></div>
            <div><div class="sp-product-img c"></div><div class="sp-product-name">Staff pick</div><div class="sp-product-price">$32.00</div></div>
          </div>
        </div>
        <div class="sp-caption">${niche} store · draft, not yet live</div>
      </div>`);
    await waitForChoice(['Looks great, let’s continue →']).then(userMsg);

    await divider('05 · Activate Shopify plan');
    await aiMsg('One thing left to make it go live:');
    addRailItem('plan', 'Shopify plan', 'Not active', true);
    const card = await aiCard(`<div class="card-bubble">
        <h4>Approve billing to keep your store</h4>
        <ul><li>$1/month for your first 3 months, then $39/month</li><li>Cancel anytime, directly in Shopify</li></ul>
        <button class="btn btn-primary" id="activateBtn" type="button">Activate My Shopify Plan ↗</button>
        <div class="card-foot">You’ll finish this on Shopify’s own secure page.</div>
      </div>`);
    await new Promise(resolve=>{
      card.querySelector('#activateBtn').addEventListener('click', resolve, {once:true});
    });
    add(el(`<div class="sys-divider">↗ opened Shopify in a new tab</div>`));
    await showHandoff('shopify.com/admin/charges', 'Confirming your Shopify plan…', 1500);
    await aiTyping(600);
    await aiMsg('✅ Your Shopify plan is active. Your store can go live.');
    resolveRailItem('plan', 'Active');
    await waitForChoice(['Continue to Store Setup →']).then(userMsg);

    await divider('06 · Store type upsell');
    await aiMsg(`Build your ${niche} store around one proven product?`);
    const upsellCard = await aiCard(`<div class="card-bubble" style="max-width:300px;">
        <h4>Build My ${niche} Store — <s style="color:var(--ink-faint);font-weight:400;">$197</s> $97</h4>
        <ul>
          <li>1 hand-picked hero product, matched to your niche</li>
          <li>Expert-designed store, ready in ~24 hours</li>
          <li>Conversion-optimized copy included</li>
        </ul>
        <button class="btn btn-primary" id="upsellBtn" type="button">Build My ${niche} Store — $97</button>
        <div class="card-foot">Matched to your niche — today only</div>
      </div>`);
    const upsell = await raceButtonVsChip(upsellCard.querySelector('#upsellBtn'), [`No thanks, I'll keep the generic 10-product store`]);
    userMsg(upsell.label);

    if (upsell.kind === 'button') {
      addRailItem('storeType', 'Store type', 'Pro ($97)');
    } else {
      await aiMsg('Totally fine — before you go, one last one-time price:');
      const downsellCard = await aiCard(`<div class="card-bubble" style="max-width:280px;">
          <h4>Same store, one-time — $47</h4>
          <ul><li>Identical Pro catalog and theme as the $97 offer</li></ul>
          <button class="btn btn-primary" id="downsellBtn" type="button">Build It for $47</button>
        </div>`);
      const downsell = await raceButtonVsChip(downsellCard.querySelector('#downsellBtn'), ["No, I'll keep the free version"]);
      userMsg(downsell.label);
      addRailItem('storeType', 'Store type', downsell.kind === 'button' ? 'Pro ($47)' : 'Free (10 products)');
    }

    await divider('07 · AutoDS trial (soft gate)');
    await aiMsg('One more thing — want us to keep your catalog stocked automatically?');
    const autodsCard = await aiCard(`<div class="card-bubble" style="max-width:280px;">
        <h4>Start your free AutoDS trial</h4>
        <ul><li>Free for 3 days</li><li>Auto-import and restock products for you</li></ul>
        <button class="btn btn-primary" id="autodsBtn" type="button">Start My Free Trial ↗</button>
        <div class="card-foot">Opens AutoDS in a new tab — no card needed to start.</div>
      </div>`);
    const autods = await raceButtonVsChip(autodsCard.querySelector('#autodsBtn'), ['Skip for now']);
    userMsg(autods.label);
    if (autods.kind === 'button') {
      add(el(`<div class="sys-divider">↗ opened AutoDS in a new tab</div>`));
      await showHandoff('autods.com/onboarding', 'Setting up your trial…', 1100);
      await aiMsg('Nice — whenever you\'re ready, just come back and keep going.');
      addRailItem('autods', 'AutoDS trial', 'Started');
    } else {
      addRailItem('autods', 'AutoDS trial', 'Skipped');
    }
    await waitForChoice(['Continue →']).then(userMsg);

    await divider('08 · Store live');
    resolveRailItem('store', 'Live');
    await aiMsg('🎉 Your store is live!');
    await aiMsg(`A few optional things whenever you're ready — a free domain, more products, help growing. No rush, none of it blocks what you already have.`);
    await waitForChoice(['Got it →']).then(userMsg);

    add(el(`<div class="end-note">— end of demo segment —</div>`));
  }

  document.getElementById('restartBtn').addEventListener('click', ()=>location.reload());
  run();
})();
</script>
